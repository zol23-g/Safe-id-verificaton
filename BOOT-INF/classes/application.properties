server.port=8080
safe.json.max-image-string-length=67108864
safe.reports-dir=reports

# Optional locally executed barcode decoder. Leave blank for enhanced ZXing.
safe.dynamsoft-license-key=

# --- LOCAL SIMULATED VISION OCR CONFIGURATION ---
safe.ocr.provider=openai
safe.ocr.api-key=local-simulated-token
safe.ocr.base-url=http://localhost:8001/v1/chat/completions
safe.ocr.model=local-vision-model

# --- LOCAL SIMULATED FACE-MATCH CONFIGURATION ---
safe.facematch.provider=openai
safe.facematch.api-key=local-simulated-token
safe.facematch.base-url=http://localhost:8001/v1/chat/completions
safe.facematch.model=local-vision-model